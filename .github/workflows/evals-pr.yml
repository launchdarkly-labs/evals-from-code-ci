name: Evals (pull request)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: evals-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      # The checkout is the pull request merged into its base branch, so HEAD^1 is the base.
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(app/|evals/|data/|tests/|requirements\.txt$|pytest\.ini$|\.github/workflows/evals-pr\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  offline:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q

  evals:
    needs: [changes, offline]
    # Pull requests from forks get no repository secrets, so they skip the evals.
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run the PR eval set
        env:
          LD_SDK_KEY: ${{ secrets.LD_SDK_KEY }}
          LD_API_TOKEN: ${{ secrets.LD_API_TOKEN }}
          LD_PROJECT_KEY: ${{ vars.LD_PROJECT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Advisory until the repository variable EVALS_BLOCKING is "true": a failed
        # eval shows in the job summary but doesn't fail the job.
        run: python -m evals.run_evals --dataset evals/datasets/pr.jsonl ${{ vars.EVALS_BLOCKING == 'true' && '--blocking' || '' }}

  # The check to require. It reports on every pull request, including ones that skip
  # the evals, and fails when any job above failed.
  evals-gate:
    needs: [changes, offline, evals]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "offline: ${{ needs.offline.result }}, evals: ${{ needs.evals.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
